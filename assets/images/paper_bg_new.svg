<?xml version="1.0" encoding="UTF-8"?>
<!--
  DormDeal crumpled paper background (source file)
  - Size: 390 x 780 (a phone-sized screen). The look scales with the viewBox.
  - Made with an SVG filter (fractal noise lit from one side). No image files are used.
  - Web: use as a background or inline SVG (filters are supported in browsers).
  - React Native: react-native-svg does NOT support filters. Use crumpled-paper.png instead.
  - To change the look, edit the numbers in the filter (see README.md).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Crumpled paper background</title>
  <filter id="crumpled-paper" x="0" y="0" width="100%" height="100%">
    <!-- 1. Random cloud-like noise. baseFrequency sets crease size: smaller = bigger folds. -->
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="5" seed="7"/>
    <!-- 2. Light the noise from one side so it reads as folds. surfaceScale sets fold depth. -->
    <feDiffuseLighting lighting-color="#ffffff" surfaceScale="2.4">
      <feDistantLight azimuth="50" elevation="62"/>
    </feDiffuseLighting>
  </filter>
  <rect width="390" height="780" filter="url(#crumpled-paper)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
